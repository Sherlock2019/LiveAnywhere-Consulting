services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ran
      POSTGRES_USER: ran
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    volumes:
      - ran_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ran -d ran"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ran:${POSTGRES_PASSWORD:-change-me-before-production}@db:5432/ran?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-long-random-secret}
      AUTH_TRUST_HOST: "true"
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@liveanywhere.consulting}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-DemoMove2027!}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  ran_postgres:
